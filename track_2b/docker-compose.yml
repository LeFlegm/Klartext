services:
  backend:
    build: ./src            # Dockerfile is in src/
    environment:            # Read from the shell or from a local .env file (never committed)
      LLM_NAME: ${LLM_NAME:-}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
    ports:
      - "8000:8000"         # host port 8000 -> container port 8000
  